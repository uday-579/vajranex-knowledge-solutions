<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}VajraNex Knowledge Solutions</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">V</span>
      VajraNex Knowledge Solutions
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/rag-in-production/' | relative_url }}">RAG in Production</a>
    </nav>
  </div>
</header>

<div class="page-wrap">
  <article class="content">
    {{ content }}
  </article>
</div>

<footer class="site-footer">
  VajraNex Knowledge Solutions — engineering notes from requirement to production.
</footer>
</body>
</html>
